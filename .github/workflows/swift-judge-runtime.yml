name: Swift judge runtime

on:
  push:
    paths:
      - "judge-gateway/Dockerfile"
      - "judge-gateway/runner/**"
      - "judge-gateway/tests/swift_runner_integration.py"
      - ".github/workflows/swift-judge-runtime.yml"
  pull_request:
    paths:
      - "judge-gateway/Dockerfile"
      - "judge-gateway/runner/**"
      - "judge-gateway/tests/swift_runner_integration.py"
      - ".github/workflows/swift-judge-runtime.yml"

jobs:
  swift-runner:
    runs-on: ubuntu-latest
    container:
      image: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install the runner's small POSIX dependency
        run: apt-get update && apt-get install --no-install-recommends -y python3
      - name: Exercise compile, runtime, timeout, and output limits
        run: python3 judge-gateway/tests/swift_runner_integration.py

  judge-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production judge image
        run: docker build --pull --tag swift-ghost-judge:ci judge-gateway
